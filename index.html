<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Robo Olympics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
:root{--p1:#3aa0ff;--p2:#ff4d5e;--text:#e8ecf5;--muted:#8a93a8;--gold:#ffd23f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1a1f33,#07080d 70%);color:var(--text);font-family:"Segoe UI",system-ui,Arial,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer}
header{text-align:center;padding:14px 0 4px}
header h1{margin:0;font-size:44px;letter-spacing:4px;font-weight:900;font-style:italic;text-transform:uppercase;background:linear-gradient(90deg,var(--p1),#fff,var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}

#builderScreen{display:grid;grid-template-columns:1fr 160px 1fr;gap:16px;padding:10px 20px 30px;max-width:1300px;margin:0 auto;align-items:start}
.panel{--c:var(--p1);background:linear-gradient(180deg,#171c2c,#10131e);border:1px solid #232a40;border-top:4px solid var(--c);border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.panel.p2{--c:var(--p2)}
.panel h2{margin:0 0 8px;color:var(--c);font-size:13px;letter-spacing:2px;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center}
input.name{flex:1;min-width:0;background:#0b0e17;border:1px solid #2a3150;color:var(--text);font-size:18px;font-weight:700;padding:8px 10px;border-radius:8px}
.small-btn{background:#232a40;color:var(--text);border:1px solid #333c5c;border-radius:8px;padding:8px 10px;white-space:nowrap}
.small-btn:hover{border-color:var(--c)}
canvas.preview{width:100%;height:auto;background:radial-gradient(ellipse at 50% 80%,#1d2440,#0b0e17);border-radius:10px;margin:10px 0 4px;display:block}
.group{margin:8px 0}
.lbl{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px}
.opt{background:#0d111c;border:1px solid #262e48;color:var(--text);border-radius:8px;padding:6px 8px;text-align:left;display:flex;flex-direction:column;gap:1px;transition:.12s}
.opt b{font-size:13px}.opt span{font-size:11px;color:var(--gold)}.opt small{font-size:10px;color:var(--muted)}
.opt:hover{border-color:var(--c)}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,#0d111c);box-shadow:0 0 0 1px var(--c) inset}
.armour{display:flex;align-items:center;gap:8px}
.plates{display:flex;gap:4px}
.plate{width:28px;height:10px;border-radius:2px;background:#262e48}.plate.on{background:#b8c2d8}
.budget{margin:10px 0}
.bar{height:10px;background:#0b0e17;border-radius:6px;overflow:hidden;border:1px solid #262e48}
.fill{height:100%;background:linear-gradient(90deg,#3ddc97,#ffd23f);transition:width .2s}
.fill.over{background:#ff4d5e}
.budget-text{display:flex;justify-content:space-between;font-size:12px;margin-top:4px;color:var(--muted)}
.budget-text b{color:var(--text)}.budget-text .over{color:#ff4d5e}
textarea{width:100%;min-height:64px;background:#0b0e17;border:1px solid #2a3150;color:var(--text);border-radius:8px;padding:8px;font-family:inherit;font-size:13px;line-height:1.4;resize:vertical}
.presets{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.preset{font-size:11px;background:#1b2135;border:1px solid #2a3150;color:#cdd5ea;border-radius:20px;padding:3px 9px}
.preset:hover{border-color:var(--c)}
.parsed{font-size:11px;color:#9fb0d0;background:#0b0e17;border:1px dashed #2a3150;border-radius:8px;padding:6px 8px;margin-top:6px;line-height:1.7}
.chip{display:inline-block;background:#1b2135;border-radius:4px;padding:0 6px;margin:1px 3px 1px 0;color:var(--text)}
.chip i{color:var(--muted);font-style:normal}
.tags{color:var(--muted)}
.ready{width:100%;margin-top:10px;padding:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;border-radius:10px;border:2px solid var(--c);background:transparent;color:var(--c)}
.ready.on{background:var(--c);color:#fff}
.ready:disabled{opacity:.4;cursor:not-allowed}
.center{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:140px;text-align:center}
.vs{font-size:60px;font-weight:900;font-style:italic;color:var(--gold);text-shadow:0 0 24px rgba(255,210,63,.5)}
#fightBtn{padding:16px 22px;font-size:22px;font-weight:900;letter-spacing:2px;border:none;border-radius:12px;background:linear-gradient(180deg,#ffd23f,#ff8a1f);color:#1a1000;text-transform:uppercase;box-shadow:0 6px 0 #a34d00}
#fightBtn:disabled{filter:grayscale(1);opacity:.35;cursor:not-allowed;box-shadow:none}
.hint{font-size:11px;color:var(--muted)}

#fightScreen{display:none;padding:12px}
#arena{display:block;width:100%;max-width:1200px;margin:0 auto;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#05060a}
.fight-bar{max-width:1200px;margin:8px auto;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}

#result{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,6,10,.7);backdrop-filter:blur(3px)}
.card{background:#141826;border:1px solid #2a3150;border-radius:16px;padding:26px 34px;text-align:center;min-width:460px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
#resWinner{font-size:40px;font-weight:900;font-style:italic;text-transform:uppercase;margin:0}
#resMethod{color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-weight:700;margin:6px 0 18px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:20px}
th,td{padding:6px 10px;border-bottom:1px solid #232a40}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.btns{display:flex;gap:10px;justify-content:center}
.btns button{padding:12px 20px;border-radius:10px;border:none;font-weight:800;letter-spacing:1px;text-transform:uppercase}
#rematchBtn{background:linear-gradient(180deg,#ffd23f,#ff8a1f);color:#1a1000}
#backBtn{background:#232a40;color:var(--text)}
#autolog{position:fixed;bottom:0;left:0;font-size:11px;color:#6f7;margin:0;padding:4px;max-height:40vh;overflow:auto;pointer-events:none}
</style>
</head>
<body>

<header>
  <h1>Robo Olympics</h1>
  <p>Build it. Brief it. Watch it brawl.</p>
</header>

<div id="builderScreen">
  <div class="panel p1" id="panel0"></div>
  <div class="center">
    <div class="vs">VS</div>
    <button id="fightBtn" disabled>Fight!</button>
    <div class="hint" id="fightHint">Both players must be Ready</div>
    <button class="small-btn" id="randomMatchBtn">🎲 Random Match</button>
  </div>
  <div class="panel p2" id="panel1"></div>
</div>

<div id="fightScreen">
  <canvas id="arena" width="1200" height="600"></canvas>
  <div class="fight-bar">
    <span>Win by KO · Flip (5 s stuck) · Pit · or HP% at time-out</span>
    <button class="small-btn" id="abortBtn">✕ Back to Builder</button>
  </div>
</div>

<div id="result">
  <div class="card">
    <p id="resWinner">Winner</p>
    <div id="resMethod">KO</div>
    <table id="resStats"></table>
    <div class="btns">
      <button id="rematchBtn">Rematch</button>
      <button id="backBtn">Back to Builder</button>
    </div>
  </div>
</div>

<pre id="autolog"></pre>

<script>
'use strict';
if (typeof Matter === 'undefined') {
  document.body.innerHTML = '<h2 style="padding:40px;color:#ff4d5e">Could not load Matter.js. Check your internet connection and reload.</h2>';
  throw new Error('Matter.js missing');
}
const { Engine, Bodies, Body, Composite, Constraint, Events, Vertices } = Matter;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);

// ============================================================
// CONFIG: every tunable number lives here
// ============================================================
const CONFIG = {
  budget: 100,
  overdrivePerPoint: 0.015,      // unspent budget -> +1.5% speed per point
  fightSeconds: 60,
  flipKOSeconds: 5,
  introSeconds: 2.4,
  stallSeconds: 8,               // no damage for this long -> both bots get impatient
  slowMo: { scale: 0.3, seconds: 1.5 },
  bigHit: 15,                    // screen shake threshold
  rageBelow: 0.25, rageDamageBonus: 0.2,
  arena: { w: 1200, h: 600, floorY: 500, pitW: 100, spawnOffset: 170, wallW: 30, pitKODepth: 70 },
  chassis: {
    light:  { name: 'Light',  cost: 20, hp: 80,  w: 74,  h: 24, mass: 3, speed: 1.25, desc: 'Fast, fragile' },
    medium: { name: 'Medium', cost: 35, hp: 120, w: 86,  h: 28, mass: 5, speed: 1.0,  desc: 'All-rounder' },
    heavy:  { name: 'Heavy',  cost: 50, hp: 170, w: 100, h: 34, mass: 8, speed: 0.78, desc: 'Slow, tanky' },
  },
  wheels: {
    small: { name: 'Small', cost: 10, r: 11, friction: 0.55, accel: 0.35, maxSpin: 0.42, mass: 0.3, desc: 'Quick accel, low grip' },
    large: { name: 'Large', cost: 20, r: 16, friction: 1.0,  accel: 0.16, maxSpin: 0.29, mass: 0.6, desc: 'Grip & push power' },
  },
  weapons: {
    spinner: { name: 'Spinner', cost: 25, desc: 'Big damage on contact', radius: 14, spinMax: 0.9, spinUp: 0.025, base: 3, mul: 0.95, hitCooldown: 0.25, knock: 2.2, reach: 24 },
    hammer:  { name: 'Hammer',  cost: 25, desc: 'Overhead strike',       cooldown: 1.3, damage: 16, flippedBonus: 1.6, reach: 40 },
    flipper: { name: 'Flipper', cost: 20, desc: 'Launches enemy up',     cooldown: 2.6, damage: 5, launch: 10.5, push: 1.5, spin: 0.24, reach: 48 },
    ram:     { name: 'Ram',     cost: 10, desc: 'Speed = damage',        mul: 3.4, minSpeed: 2, cooldown: 3, boost: 1.6, boostTime: 0.6, reach: 34 },
  },
  armour: { cost: 10, max: 2, reduction: 0.15, mass: 0.8 },
  bump: { minSpeed: 5, mul: 0.8 },
  landing: { minSpeed: 7, mul: 2.2 },
  hammerAngles: { rest: -1.75, strike: 0.05 },
};

// ============================================================
// PARTS: costs, geometry (shared by preview + physics), random builds
// ============================================================
const NAME_A = ['Iron', 'Turbo', 'Mega', 'Hyper', 'Saiyan', 'Steel', 'Doom', 'Rusty', 'Atomic', 'Kaiju', 'Neon', 'Ultra'];
const NAME_B = ['Crusher', 'Fang', 'Bolt', 'Smasher', 'Titan', 'Wrecker', 'Dynamo', 'Fist', 'Blitz', 'Kong', 'Viper', 'Mauler'];
const pick = a => a[Math.floor(Math.random() * a.length)];

const PARTS = {
  cost(b) {
    return CONFIG.chassis[b.chassis].cost + CONFIG.wheels[b.wheels].cost +
           CONFIG.weapons[b.weapon].cost + b.armour * CONFIG.armour.cost;
  },
  overdrive(b) { return 1 + Math.max(0, CONFIG.budget - PARTS.cost(b)) * CONFIG.overdrivePerPoint; },
  // Local coords: origin = chassis centre, y down, f = facing (+1 right, -1 left)
  geometry(b, f) {
    const ch = CONFIG.chassis[b.chassis], wh = CONFIG.wheels[b.wheels], wp = CONFIG.weapons[b.weapon];
    const w = ch.w, h = ch.h, r = wh.r;
    const wheelY = h / 2 - 2, wheelX = w / 2 - r - 2;
    const ground = wheelY + r;
    const fx = f * w / 2;
    const g = { w, h, r, f, ground, wheels: [{ x: f * wheelX, y: wheelY }, { x: -f * wheelX, y: wheelY }] };
    if (b.weapon === 'ram')     g.wedge = [{ x: fx, y: -h / 2 }, { x: fx, y: ground - 5 }, { x: fx + f * 32, y: ground - 5 }];
    if (b.weapon === 'flipper') g.wedge = [{ x: fx, y: -2 }, { x: fx, y: ground - 4 }, { x: fx + f * 44, y: ground - 4 }];
    if (b.weapon === 'spinner') g.spinner = { x: fx + f * 10, y: -2, r: wp.radius };
    if (b.weapon === 'hammer')  g.hammer = { x: f * w * 0.05, y: -h / 2, len: 0.45 * w + 38 };
    return g;
  },
  randomBuild() {
    for (let i = 0; i < 200; i++) {
      const b = { chassis: pick(Object.keys(CONFIG.chassis)), wheels: pick(Object.keys(CONFIG.wheels)),
                  weapon: pick(Object.keys(CONFIG.weapons)), armour: Math.floor(Math.random() * (CONFIG.armour.max + 1)) };
      if (PARTS.cost(b) <= CONFIG.budget) return b;
    }
    return { chassis: 'medium', wheels: 'large', weapon: 'spinner', armour: 0 };
  },
  randomName() { return pick(NAME_A) + ' ' + pick(NAME_B); },
};

// ============================================================
// STRATEGY: English -> behaviour { params, tags, decide(state) }
// ============================================================
const STRATEGY_PRESETS = [
  { label: 'Berserker',   text: 'Aggressive! Rush them nonstop and never back down.' },
  { label: 'Turtle',      text: 'Defensive. Keep distance and wait. Attack when they get close. Retreat when low.' },
  { label: 'Executioner', text: 'Patient. Stay back until they are flipped, then smash them.' },
  { label: 'Ring-Out',    text: 'Charge and push them into the pit. Reckless.' },
  { label: 'Trickster',   text: 'Bait and juke at 200px, finish them off when they are weak. Avoid the edge.' },
];

function strategyToBehaviour(text) {
  // TODO: replace with Claude API call that returns a decide() function
  let t = ' ' + (text || '').toLowerCase().replace(/\s+/g, ' ') + ' ';
  const p = { aggression: 0.55, preferredDistance: 150, attackWhen: 'always', retreatBelowHealth: 0,
              edgeCaution: 0.6, pitPush: false, feint: false };
  const tags = [];

  // Retreat clause first, then strip it so "low" isn't read as "enemy low health"
  const rm = t.match(/(retreat|run away|run|back off|flee|escape|fall back)[^.!;,]*?(?:(\d{1,2})\s*%|low|hurt|damaged|weak|losing)/);
  if (rm) {
    p.retreatBelowHealth = rm[2] ? clamp(+rm[2] / 100, 0.05, 0.9) : 0.3;
    tags.push('retreat clause'); t = t.replace(rm[0], ' ');
  }
  const neg = t.match(/(don'?t|do not|never|no)\s+(rush|charge|attack|be aggressive)/);
  if (neg) { p.aggression -= 0.3; tags.push('negated "' + neg[2] + '"'); t = t.replace(neg[0], ' '); }

  const aggro = t.match(/aggress|charge|rush|berserk|relentless|all.?out|hunt|destroy|smash|full speed|go hard|wreck|attack|pressure|nonstop|non-stop/g) || [];
  const def = t.match(/defen|careful|cautious|patient|wait|keep (my |a |our )?distance|stay (away|back)|kite|hold back|safe|turtle|bait/g) || [];
  p.aggression = clamp(p.aggression + 0.17 * aggro.length - 0.17 * def.length, 0, 1);
  if (aggro.length) tags.push('aggro: ' + [...new Set(aggro)].join(', '));
  if (def.length) { tags.push('defensive: ' + [...new Set(def)].join(', ')); p.preferredDistance = 240 + 25 * (def.length - 1); }
  if (aggro.length > def.length) p.preferredDistance = 60;
  const px = t.match(/(\d{2,3})\s*(px|pixels)/);
  if (px) { p.preferredDistance = clamp(+px[1], 40, 450); tags.push(px[1] + 'px'); }

  // Attack gate, highest priority first
  if (/(they|enemy|opponent|it|he)\s*(are|is|get|gets|got|'re|'s)?\s*(flipped|upside|on (its|their|his) back|turned over)/.test(t) ||
      /(when|once|after|until|if)\s*(they|enemy|opponent|it)?\s*flips?\b/.test(t)) p.attackWhen = 'enemyFlipped';
  else if (/(they|enemy|opponent|it)\s*(are|is|get|gets|'re)?\s*(low|weak|hurt|damaged|almost dead|dying)|finish (them|him|it|her) off|go for the kill/.test(t)) p.attackWhen = 'enemyLowHealth';
  else if (/(they|enemy|opponent|it)\s*(are|is|get|gets|come|comes|'re)?\s*(close|near|in range)|counter.?attack|up close/.test(t)) p.attackWhen = 'enemyClose';
  if (p.attackWhen !== 'always') tags.push('gate: ' + p.attackWhen);

  if (/(push|shove|knock|ram)[^.!;]*(pit|edge|off|out)|ring.?out/.test(t)) { p.pitPush = true; tags.push('pit push'); }
  if (/(avoid|careful|stay away from|watch|mind)[^.!;]*(pit|edge)/.test(t)) { p.edgeCaution = 1; tags.push('edge-aware'); }
  else if (/reckless|yolo|crazy|fearless/.test(t)) { p.edgeCaution = 0.15; tags.push('reckless'); }
  if (/feint|juke|bait|fake|dodge|zig.?zag|trick/.test(t)) { p.feint = true; tags.push('feints'); }
  if (!tags.length) tags.push('no keywords: balanced defaults');

  function decide(s) {
    const me = s.me, en = s.enemy;
    const toward = (Math.sign(s.dx) || 1) * me.facing;           // +1 = enemy is on my weapon side
    const impatient = s.stallTime > CONFIG.stallSeconds;
    const aggr = clamp(p.aggression + (impatient ? 0.3 : 0) + (me.rage ? 0.15 : 0), 0, 1);
    const closeRange = Math.max(s.weaponRange + 30, Math.min(p.preferredDistance * 0.7, 170));

    let engage;
    switch (p.attackWhen) {
      case 'enemyClose':     engage = s.distance < closeRange; break;
      case 'enemyFlipped':   engage = s.isEnemyFlipped; break;
      case 'enemyLowHealth': engage = en.hpPct < 0.35; break;
      default:               engage = true;
    }
    if (impatient) engage = true;
    const losing = p.retreatBelowHealth > 0 && me.hpPct < p.retreatBelowHealth && me.hpPct < en.hpPct;
    let mode = (losing && !impatient) ? 'RETREAT' : engage ? 'ENGAGE' : 'HOLD';

    let drive;
    if (mode === 'ENGAGE') {
      drive = toward * (0.45 + 0.55 * aggr);
      if (p.feint && s.distance > 180) drive *= 0.75 + 0.5 * Math.sin(s.time * 6);
      const enRoom = Math.min(en.x - s.arena.left, s.arena.right - en.x);
      if (p.pitPush && enRoom < 200 && s.distance < 260) { drive = toward; mode = 'RING-OUT'; }
    } else if (mode === 'HOLD') {
      const target = p.preferredDistance * (1.25 - 0.5 * aggr);
      drive = toward * clamp((s.distance - target) / 90, -1, 1) * 0.8;
      if (p.feint) drive += 0.45 * Math.sin(s.time * 4.5);
    } else {
      drive = -toward * (s.distance < 320 ? 0.9 : 0.2);
    }

    // Edge awareness: don't drive into a pit unless shoving the enemy over it
    const worldDir = Math.sign(drive * me.facing);
    const room = worldDir > 0 ? s.arena.right - me.x : me.x - s.arena.left;
    const margin = 70 + 110 * p.edgeCaution;
    const shoving = toward * Math.sign(drive) > 0 && s.distance < 160 && Math.sign(s.dx) === worldDir;
    if (worldDir !== 0 && room < margin && !(shoving && room > (p.pitPush ? 12 : 45))) {
      drive = -Math.sign(drive) * 0.5;
      mode = (mode === 'HOLD' || mode === 'RETREAT') && s.distance < 220 ? 'CORNERED' : 'EDGE';
    }

    let fire = false;
    if (s.weaponReady) {
      const inRange = s.enemyInFront && s.distance < s.weaponRange;
      if (me.flipped) fire = true;                                      // self-right attempt
      else if (me.weapon === 'ram') fire = mode !== 'HOLD' && toward > 0 && s.distance > s.weaponRange && s.distance < 320;
      else fire = inRange && (mode !== 'HOLD' || s.distance < s.weaponRange * 0.9);
    }
    return { drive: clamp(drive, -1, 1), fire, mode };
  }

  return { params: p, tags, decide };
}

// Used whenever a strategy's decide() throws or returns garbage
const FALLBACK = {
  decide(s) {
    const toward = (Math.sign(s.dx) || 1) * s.me.facing;
    return { drive: toward * 0.7, fire: s.weaponReady && s.enemyInFront && s.distance < s.weaponRange, mode: 'FALLBACK' };
  },
};

// ============================================================
// BUILDER UI
// ============================================================
const players = [
  { id: 0, color: '#3aa0ff', facing: 1, name: 'Blue Thunder', ready: false,
    build: { chassis: 'medium', wheels: 'large', weapon: 'spinner', armour: 1 },
    strategy: 'Aggressive. Charge and attack nonstop. Retreat when low.' },
  { id: 1, color: '#ff4d5e', facing: -1, name: 'Red Fury', ready: false,
    build: { chassis: 'heavy', wheels: 'large', weapon: 'flipper', armour: 0 },
    strategy: 'Patient. Wait until they get close, then flip them. Push them into the pit.' },
];

function optButtons(cat) {
  const src = CONFIG[cat === 'weapon' ? 'weapons' : cat];
  return Object.entries(src).map(([k, v]) =>
    `<button class="opt" data-cat="${cat}" data-key="${k}"><b>${v.name}</b>` +
    `<span>${v.cost} pts${v.hp ? ' · ' + v.hp + ' HP' : ''}</span><small>${v.desc}</small></button>`).join('');
}

function buildPanel(i) {
  const p = players[i], el = document.getElementById('panel' + i);
  el.innerHTML = `
    <h2>Player ${i + 1}</h2>
    <div class="row"><input class="name" maxlength="18"><button class="small-btn rand">🎲 Random</button></div>
    <canvas class="preview" width="320" height="170"></canvas>
    <div class="group"><span class="lbl">Chassis</span><div class="opts">${optButtons('chassis')}</div></div>
    <div class="group"><span class="lbl">Wheels</span><div class="opts">${optButtons('wheels')}</div></div>
    <div class="group"><span class="lbl">Weapon</span><div class="opts">${optButtons('weapon')}</div></div>
    <div class="group"><span class="lbl">Armour plates (−15% dmg each, 10 pts)</span>
      <div class="armour"><button class="small-btn arm" data-d="-1">−</button><div class="plates"></div><button class="small-btn arm" data-d="1">+</button></div></div>
    <div class="budget"><div class="bar"><div class="fill"></div></div><div class="budget-text"><span class="cost"></span><span class="od"></span></div></div>
    <span class="lbl">Strategy (plain English)</span>
    <div class="presets">${STRATEGY_PRESETS.map((s, k) => `<button class="preset" data-k="${k}">${s.label}</button>`).join('')}</div>
    <textarea class="strategy" spellcheck="false"></textarea>
    <div class="parsed"></div>
    <button class="ready">Ready</button>`;
  el.querySelector('.name').value = p.name;
  el.querySelector('.strategy').value = p.strategy;

  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.classList.contains('opt')) { p.build[b.dataset.cat] = b.dataset.key; p.ready = false; }
    else if (b.classList.contains('arm')) { p.build.armour = clamp(p.build.armour + +b.dataset.d, 0, CONFIG.armour.max); p.ready = false; }
    else if (b.classList.contains('rand')) {
      p.build = PARTS.randomBuild(); p.name = PARTS.randomName(); p.strategy = pick(STRATEGY_PRESETS).text; p.ready = false;
      el.querySelector('.name').value = p.name; el.querySelector('.strategy').value = p.strategy;
    }
    else if (b.classList.contains('preset')) { p.strategy = STRATEGY_PRESETS[+b.dataset.k].text; el.querySelector('.strategy').value = p.strategy; }
    else if (b.classList.contains('ready')) { if (PARTS.cost(p.build) <= CONFIG.budget) p.ready = !p.ready; }
    refreshPanel(i);
  });
  el.querySelector('.name').addEventListener('input', e => { p.name = e.target.value || 'Robot ' + (i + 1); refreshPanel(i); });
  el.querySelector('.strategy').addEventListener('input', e => { p.strategy = e.target.value; refreshPanel(i); });
}

function refreshPanel(i) {
  const p = players[i], el = document.getElementById('panel' + i);
  el.querySelectorAll('.opt').forEach(b => b.classList.toggle('sel', p.build[b.dataset.cat] === b.dataset.key));
  el.querySelector('.plates').innerHTML = Array.from({ length: CONFIG.armour.max }, (_, k) => `<div class="plate ${k < p.build.armour ? 'on' : ''}"></div>`).join('');
  const cost = PARTS.cost(p.build), over = cost > CONFIG.budget;
  if (over) p.ready = false;
  const fill = el.querySelector('.fill');
  fill.style.width = Math.min(100, cost / CONFIG.budget * 100) + '%';
  fill.classList.toggle('over', over);
  el.querySelector('.cost').innerHTML = `Weight: <b class="${over ? 'over' : ''}">${cost} / ${CONFIG.budget}</b> pts${over ? ' · <span class="over">OVER BUDGET</span>' : ''}`;
  const od = Math.round((PARTS.overdrive(p.build) - 1) * 100);
  el.querySelector('.od').textContent = od > 0 ? `Overdrive +${od}% speed` : '';

  const beh = strategyToBehaviour(p.strategy), q = beh.params;
  el.querySelector('.parsed').innerHTML =
    `<span class="chip"><i>aggression</i> ${q.aggression.toFixed(2)}</span>` +
    `<span class="chip"><i>distance</i> ${q.preferredDistance}px</span>` +
    `<span class="chip"><i>attack</i> ${q.attackWhen}</span>` +
    `<span class="chip"><i>retreat</i> ${q.retreatBelowHealth ? '<' + Math.round(q.retreatBelowHealth * 100) + '%' : 'never'}</span>` +
    `<span class="chip"><i>edge caution</i> ${q.edgeCaution}</span>` +
    (q.pitPush ? '<span class="chip">pit push</span>' : '') + (q.feint ? '<span class="chip">feints</span>' : '') +
    `<div class="tags">read: ${beh.tags.join(' · ')}</div>`;

  const rb = el.querySelector('.ready');
  rb.disabled = over; rb.classList.toggle('on', p.ready);
  rb.textContent = over ? 'Over budget' : p.ready ? '✓ Ready' : 'Ready';
  drawPreview(i);
  const both = players.every(pl => pl.ready);
  document.getElementById('fightBtn').disabled = !both;
  document.getElementById('fightHint').textContent = both ? 'Let’s go!' : 'Both players must be Ready';
}

function drawPreview(i) {
  const p = players[i], cv = document.querySelector('#panel' + i + ' canvas'), ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  const floorY = 150, g = PARTS.geometry(p.build, p.facing);
  ctx.fillStyle = '#2a3150'; ctx.fillRect(20, floorY, cv.width - 40, 3);
  ctx.save();
  ctx.translate(cv.width / 2, floorY - g.ground);
  drawChassisLocal(ctx, p.build, g, p.color, { hammer: CONFIG.hammerAngles.rest, flip: 0 });
  g.wheels.forEach(w => drawWheel(ctx, w.x, w.y, g.r, 0));
  if (g.spinner) drawSpinner(ctx, g.spinner.x, g.spinner.y, g.spinner.r, 0.3, 0);
  ctx.restore();
}

// ============================================================
// ROBOT FACTORY: build Matter bodies from a player's parts
// ============================================================
function createRobot(player, x) {
  const b = player.build, f = player.facing, g = PARTS.geometry(b, f);
  const ch = CONFIG.chassis[b.chassis], wh = CONFIG.wheels[b.wheels], wp = CONFIG.weapons[b.weapon];
  const filter = { group: Body.nextGroup(true) };        // a robot's own parts never collide with each other
  const y = CONFIG.arena.floorY - g.ground - 1;

  const rect = Bodies.rectangle(x, y, g.w, g.h, { chamfer: { radius: 4 }, collisionFilter: filter });
  rect.robo = { role: 'chassis' };
  const parts = [rect];
  if (g.wedge) {
    const verts = g.wedge.map(v => ({ x: x + v.x, y: y + v.y }));
    const c = Vertices.centre(verts);
    const wedge = Bodies.fromVertices(c.x, c.y, [verts], { collisionFilter: filter });
    wedge.robo = { role: b.weapon };
    parts.push(wedge);
  }
  const body = Body.create({ parts, collisionFilter: filter, friction: 0.2, restitution: 0.05 });
  Body.setMass(body, ch.mass + b.armour * CONFIG.armour.mass);
  const rel = pt => ({ x: pt.x - body.position.x, y: pt.y - body.position.y });

  const wheels = g.wheels.map(o => {
    const w = Bodies.circle(x + o.x, y + o.y, g.r, { friction: wh.friction, frictionStatic: 1, restitution: 0, collisionFilter: filter });
    Body.setMass(w, wh.mass); w.robo = { role: 'wheel' };
    return w;
  });
  const cons = wheels.map((w, k) => Constraint.create({
    bodyA: body, pointA: rel({ x: x + g.wheels[k].x, y: y + g.wheels[k].y }), bodyB: w, pointB: { x: 0, y: 0 },
    length: 0, stiffness: 0.6, damping: 0.08 }));

  let spinner = null;
  if (g.spinner) {
    spinner = Bodies.circle(x + g.spinner.x, y + g.spinner.y, g.spinner.r, { friction: 1, restitution: 0.3, collisionFilter: filter });
    Body.setMass(spinner, 0.4); spinner.robo = { role: 'spinner' };
    cons.push(Constraint.create({ bodyA: body, pointA: rel({ x: x + g.spinner.x, y: y + g.spinner.y }), bodyB: spinner, length: 0, stiffness: 1 }));
  }

  const robot = {
    player, name: player.name, color: player.color, build: b, g, f, body, wheels, spinner, cons,
    rectOffset: rel(rect.position), all: [body, ...wheels, ...(spinner ? [spinner] : [])],
    maxHp: ch.hp, hp: ch.hp, ghost: ch.hp, overdrive: PARTS.overdrive(b),
    cooldown: 0.5, spin: 0, hammerT: -1, flipT: -1, boostT: 0, flipped: false, flippedTime: 0,
    rage: false, lastSpinHit: -9, lastLand: -9, lastBump: -9, lastHitBy: null, lastHitAt: -9,
    mode: '', warned: false, behaviour: strategyToBehaviour(player.strategy),
    stats: { dealt: 0, biggest: 0, hits: 0 },
  };
  robot.totalMass = robot.all.reduce((s, bd) => s + bd.mass, 0);
  [...parts, ...wheels, spinner].forEach(bd => { if (bd) bd.robot = robot; });
  return robot;
}

function rectCentre(r) {
  const a = r.body.angle, o = r.rectOffset, c = Math.cos(a), s = Math.sin(a);
  return { x: r.body.position.x + o.x * c - o.y * s, y: r.body.position.y + o.x * s + o.y * c };
}
function localToWorld(r, lx, ly) {
  const c = rectCentre(r), a = r.body.angle, co = Math.cos(a), si = Math.sin(a);
  return { x: c.x + lx * co - ly * si, y: c.y + lx * si + ly * co };
}
function hammerAngle(t) {
  const { rest, strike } = CONFIG.hammerAngles;
  if (t < 0) return rest;
  if (t < 0.16) return lerp(rest, strike, (t / 0.16) ** 2);
  if (t < 0.3) return strike;
  return lerp(strike, rest, Math.min(1, (t - 0.3) / 0.5));
}
function flipAngle(t) {
  if (t < 0) return 0;
  if (t < 0.08) return t / 0.08;
  if (t < 0.2) return 1;
  return lerp(1, 0, Math.min(1, (t - 0.2) / 0.3));
}

// ============================================================
// FIGHT LOOP
// ============================================================
let fight = null, rafId = null;
const AUTO = location.hash.includes('auto');
const STEP = 1 / 60;

function startFight() {
  teardown();
  const A = CONFIG.arena;
  const engine = Engine.create();
  engine.gravity.y = 1;
  engine.positionIterations = 8; engine.velocityIterations = 6;
  const floorL = A.wallW + A.pitW, floorR = A.w - A.wallW - A.pitW;
  Composite.add(engine.world, [
    Bodies.rectangle((floorL + floorR) / 2, A.floorY + 50, floorR - floorL, 100, { isStatic: true, friction: 1 }),
    Bodies.rectangle(A.wallW / 2, A.h / 2 - 500, A.wallW, A.h + 1000, { isStatic: true }),
    Bodies.rectangle(A.w - A.wallW / 2, A.h / 2 - 500, A.wallW, A.h + 1000, { isStatic: true }),
  ]);
  const r1 = createRobot(players[0], A.w / 2 - A.spawnOffset), r2 = createRobot(players[1], A.w / 2 + A.spawnOffset);
  [r1, r2].forEach(r => Composite.add(engine.world, [...r.all, ...r.cons]));

  fight = {
    engine, robots: [r1, r2], floorL, floorR, phase: 'intro', introT: CONFIG.introSeconds,
    time: CONFIG.fightSeconds, clock: 0, stall: 0, koT: 0, slow: false, winner: null, method: '',
    shake: 0, particles: [], texts: [], banner: null, last: performance.now(), acc: 0,
    crowd: Array.from({ length: 140 }, (_, k) => ({ x: (k / 140) * A.w + rand(-4, 4), y: rand(360, 420), r: rand(7, 11), s: rand(0.12, 0.3) })),
  };
  setBanner(`${r1.name}  VS  ${r2.name}`, '#ffffff', 1.4, 'ROUND 1');
  Events.on(engine, 'collisionStart', e => e.pairs.forEach(pr => handlePair(pr, false)));
  Events.on(engine, 'collisionActive', e => e.pairs.forEach(pr => handlePair(pr, true)));
  document.getElementById('builderScreen').style.display = 'none';
  document.querySelector('header').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  document.getElementById('fightScreen').style.display = 'block';
  if (AUTO) { const f = fight; setTimeout(() => fight === f && frame(0), 0); } else rafId = requestAnimationFrame(frame);
}

function teardown() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  if (fight) { Events.off(fight.engine); Composite.clear(fight.engine.world, false); Engine.clear(fight.engine); }
  fight = null;
}

function backToBuilder() {
  teardown();
  document.getElementById('result').style.display = 'none';
  document.getElementById('fightScreen').style.display = 'none';
  document.getElementById('builderScreen').style.display = 'grid';
  document.querySelector('header').style.display = 'block';
  refreshPanel(0); refreshPanel(1);
}

function frame(now) {
  if (!fight) return;
  if (AUTO) {   // headless test mode: fast-forward with fixed steps, no rAF
    for (let i = 0; i < 30 && fight; i++) step(STEP);
    if (fight) { render(); const f = fight; setTimeout(() => fight === f && frame(0), 0); }
    return;
  }
  const dt = Math.min(0.05, (now - fight.last) / 1000);
  fight.last = now;
  fight.acc += dt;
  let n = 0;
  while (fight && fight.acc >= STEP && n < 4) { step(STEP); fight && (fight.acc -= STEP); n++; }
  if (!fight) return;
  if (n === 4) fight.acc = 0;
  render();
  rafId = requestAnimationFrame(frame);
}

function step(dt) {
  const F = fight;
  const ts = (F.phase === 'ko' && F.slow) ? CONFIG.slowMo.scale : 1;
  F.engine.timing.timeScale = ts;
  const gdt = dt * ts;
  F.clock += gdt;

  if (F.phase === 'intro') {
    F.introT -= dt;
    if (F.introT <= 0) { F.phase = 'fight'; setBanner('FIGHT!', '#ffd23f', 0.9); }
  }
  F.robots.forEach((r, i) => controlRobot(r, F.robots[1 - i], gdt));
  Engine.update(F.engine, 1000 / 60);

  if (F.phase === 'fight') {
    F.time = Math.max(0, F.time - dt);
    F.stall += dt;
    if (Math.abs(F.stall - CONFIG.stallSeconds) < dt / 2) setBanner('REF: FIGHT!', '#ff8a1f', 0.9, 'both bots get impatient');
    checkWin();
  } else if (F.phase === 'ko') {
    F.koT -= dt;
    if (F.koT <= 0) showResult();
  }
  updateEffects(gdt, dt);
}

function buildState(r, en) {
  const snap = x => ({
    x: x.body.position.x, y: x.body.position.y, vx: x.body.velocity.x, vy: x.body.velocity.y, angle: x.body.angle,
    health: x.hp, maxHealth: x.maxHp, hpPct: x.hp / x.maxHp, facing: x.f, flipped: x.flipped, rage: x.rage, weapon: x.build.weapon,
  });
  const me = snap(r), enemy = snap(en), dx = enemy.x - me.x;
  return {
    me, enemy, dx, distance: Math.abs(dx), enemyInFront: dx * r.f > 0, isEnemyFlipped: en.flipped,
    weaponReady: r.cooldown <= 0, weaponRange: r.g.w / 2 + CONFIG.weapons[r.build.weapon].reach + en.g.w / 2,
    time: fight.clock, stallTime: fight.stall, arena: { left: fight.floorL, right: fight.floorR },
  };
}

function controlRobot(r, en, gdt) {
  const F = fight, b = r.build;
  const ch = CONFIG.chassis[b.chassis], wh = CONFIG.wheels[b.wheels], wp = CONFIG.weapons[b.weapon];
  r.cooldown = Math.max(0, r.cooldown - gdt);
  r.boostT = Math.max(0, r.boostT - gdt);
  r.flipped = Math.cos(r.body.angle) < -0.1;
  r.flippedTime = (r.flipped && F.phase === 'fight') ? r.flippedTime + gdt : 0;
  if (r.ghost > r.hp) r.ghost = Math.max(r.hp, r.ghost - Math.max(0.25, (r.ghost - r.hp) * 0.04));

  if (r.spinner) {
    r.spin = Math.min(wp.spinMax, r.spin + wp.spinUp * r.overdrive);
    Body.setAngularVelocity(r.spinner, -r.f * r.spin);   // front of drum moves upward -> launches
  }
  if (r.hammerT >= 0) {
    const prev = r.hammerT; r.hammerT += gdt;
    if (prev < 0.16 && r.hammerT >= 0.16) hammerImpact(r, en);
    if (r.hammerT > 0.8) r.hammerT = -1;
  }
  if (r.flipT >= 0) { r.flipT += gdt; if (r.flipT > 0.5) r.flipT = -1; }

  let out = { drive: 0, fire: false, mode: '' };
  if (F.phase === 'fight') {
    const s = buildState(r, en);
    try {
      out = r.behaviour.decide(s);
      if (!out || !isFinite(out.drive)) throw new Error('decide() returned invalid output');
    } catch (err) {
      if (!r.warned) { console.warn(`[${r.name}] strategy failed, using fallback:`, err.message); r.warned = true; }
      out = FALLBACK.decide(s);
    }
  }
  r.mode = out.mode || '';
  const maxSpin = wh.maxSpin * ch.speed * r.overdrive * (r.boostT > 0 ? CONFIG.weapons.ram.boost : 1);
  const target = clamp(out.drive, -1, 1) * maxSpin * r.f;
  r.wheels.forEach(w => Body.setAngularVelocity(w, w.angularVelocity + (target - w.angularVelocity) * wh.accel));
  if (out.fire && r.cooldown <= 0 && F.phase === 'fight') fireWeapon(r, en);
}

function fireWeapon(r, en) {
  const wp = CONFIG.weapons[r.build.weapon];
  switch (r.build.weapon) {
    case 'hammer':
      r.hammerT = 0; r.cooldown = wp.cooldown / r.overdrive;
      if (r.flipped) selfRight(r, 0.75);
      break;
    case 'flipper':
      r.flipT = 0; r.cooldown = wp.cooldown / r.overdrive;
      if (r.flipped) selfRight(r, 1); else flipperImpact(r, en);
      break;
    case 'ram':
      if (r.flipped) return;
      r.boostT = wp.boostTime; r.cooldown = wp.cooldown;
      break;
    default: r.cooldown = 0.5;  // spinner is always on
  }
}

function setAllVelocity(r, fn) { r.all.forEach(bd => Body.setVelocity(bd, fn(bd.velocity))); }

function selfRight(r, power) {
  const a = Math.atan2(Math.sin(r.body.angle), Math.cos(r.body.angle));
  setAllVelocity(r, v => ({ x: v.x, y: -7 * power }));
  Body.setAngularVelocity(r.body, -Math.sign(a || 1) * 0.24 * power);
  const c = rectCentre(r);
  sparks(c.x, c.y + 10, 6, '#ffffff');
  floatText(c.x, c.y - 40, 'SELF-RIGHT!', '#9fe8ff', 16);
}

function flipperImpact(r, en) {
  const wp = CONFIG.weapons.flipper;
  const dx = (en.body.position.x - r.body.position.x) * r.f, dy = en.body.position.y - r.body.position.y;
  const reach = r.g.w / 2 + wp.reach + en.g.w / 2 + 10;
  if (dx <= 0 || dx > reach || Math.abs(dy) > 80) return;
  const k = clamp(Math.sqrt(5.5 / en.totalMass), 0.6, 1.25);
  setAllVelocity(en, v => ({ x: r.f * wp.push, y: -wp.launch * k }));
  Body.setAngularVelocity(en.body, r.f * wp.spin);
  const tip = localToWorld(r, r.g.wedge[2].x, r.g.wedge[2].y);
  damage(en, wp.damage, r, tip.x, tip.y);
  floatText(en.body.position.x, en.body.position.y - 70, 'FLIP!', '#ffd23f', 22);
}

function hammerImpact(r, en) {
  const wp = CONFIG.weapons.hammer, h = r.g.hammer, th = CONFIG.hammerAngles.strike;
  const head = localToWorld(r, h.x + r.f * h.len * Math.cos(th), h.y + h.len * Math.sin(th));
  const bd = en.body.bounds;
  if (head.x > bd.min.x - 18 && head.x < bd.max.x + 18 && head.y > bd.min.y - 30 && head.y < bd.max.y + 15) {
    const bonus = en.flipped ? wp.flippedBonus : 1;
    damage(en, wp.damage * bonus, r, head.x, head.y);
    Body.setVelocity(en.body, { x: en.body.velocity.x + r.f * 1.5, y: en.body.velocity.y + 4 });
    if (bonus > 1) floatText(head.x, head.y - 50, 'SMASH!', '#ffd23f', 22);
  } else {
    sparks(head.x, head.y, 2, '#888888');
  }
}

// ============================================================
// DAMAGE: collisions, weapons, win conditions
// ============================================================
function contactPoint(pair) {
  const s = pair.collision.supports && pair.collision.supports[0];
  return s ? { x: s.x, y: s.y } : { x: (pair.bodyA.position.x + pair.bodyB.position.x) / 2, y: (pair.bodyA.position.y + pair.bodyB.position.y) / 2 };
}

function handlePair(pair, active) {
  if (!fight || fight.phase !== 'fight') return;
  const a = pair.bodyA, b = pair.bodyB, ra = a.robot, rb = b.robot;
  if (ra && rb && ra !== rb) {
    weaponHit(a, ra, b, rb, pair, active);
    weaponHit(b, rb, a, ra, pair, active);
    if (!active && a.robo.role === 'chassis' && b.robo.role === 'chassis') bump(ra, rb, pair);
  } else if (!active && (ra || rb) && !(ra && rb)) {
    const part = ra ? a : b, r = ra || rb;
    if (part.robo.role !== 'wheel' && part.robo.role !== 'spinner') landing(r, pair);
  }
}

function weaponHit(atkPart, atk, defPart, def, pair, active) {
  const role = atkPart.robo.role, F = fight;
  if (role === 'spinner') {
    const wp = CONFIG.weapons.spinner;
    if (F.clock - atk.lastSpinHit < wp.hitCooldown || atk.spin < wp.spinMax * 0.25) return;
    const n = pair.collision.normal;
    const rel = Math.abs((def.body.velocity.x - atk.body.velocity.x) * n.x + (def.body.velocity.y - atk.body.velocity.y) * n.y);
    const dmg = wp.base + wp.mul * (rel + atk.spin * wp.radius * 0.5);
    const dir = Math.sign(def.body.position.x - atk.body.position.x) || atk.f;
    const k = wp.knock * (atk.spin / wp.spinMax) * clamp(Math.sqrt(5.5 / def.totalMass), 0.5, 1.3);
    setAllVelocity(def, v => ({ x: v.x + dir * k, y: v.y - k * 0.7 }));
    setAllVelocity(atk, v => ({ x: v.x - dir * k * 0.3, y: v.y }));
    atk.lastSpinHit = F.clock;
    atk.spin *= 0.35;
    const p = contactPoint(pair);
    damage(def, dmg, atk, p.x, p.y);
    return;
  }
  if (active) return;
  if (role === 'ram' || role === 'flipper') {
    const wp = CONFIG.weapons.ram;
    const closing = (atk.body.velocity.x - def.body.velocity.x) * atk.f;
    if (closing > wp.minSpeed) {
      const p = contactPoint(pair);
      damage(def, closing * wp.mul * (role === 'ram' ? 1 : 0.4), atk, p.x, p.y);
    }
  }
}

function bump(ra, rb, pair) {
  if (fight.clock - ra.lastBump < 0.3) return;
  const n = pair.collision.normal;
  const rel = Math.abs((ra.body.velocity.x - rb.body.velocity.x) * n.x + (ra.body.velocity.y - rb.body.velocity.y) * n.y);
  if (rel < CONFIG.bump.minSpeed) return;
  ra.lastBump = rb.lastBump = fight.clock;
  const d = (rel - CONFIG.bump.minSpeed) * CONFIG.bump.mul, p = contactPoint(pair);
  damage(ra, d, rb, p.x, p.y);
  damage(rb, d, ra, p.x, p.y);
}

function landing(r, pair) {
  if (fight.clock - r.lastLand < 0.3) return;
  const n = pair.collision.normal, v = r.body.velocity;
  const s = Math.abs(v.x * n.x + v.y * n.y);
  if (s < CONFIG.landing.minSpeed) return;
  r.lastLand = fight.clock;
  const src = r.lastHitBy && fight.clock - r.lastHitAt < 3 ? r.lastHitBy : null;
  const p = contactPoint(pair);
  damage(r, (s - CONFIG.landing.minSpeed) * CONFIG.landing.mul, src, p.x, p.y);
}

function damage(target, amount, attacker, x, y) {
  const F = fight;
  if (!F || F.phase !== 'fight' || target.hp <= 0) return;
  let d = amount * (1 - target.build.armour * CONFIG.armour.reduction);
  if (attacker && attacker.rage) d *= 1 + CONFIG.rageDamageBonus;
  if (d < 0.5) return;
  target.hp = Math.max(0, target.hp - d);
  if (attacker) {
    attacker.stats.dealt += d; attacker.stats.hits++;
    attacker.stats.biggest = Math.max(attacker.stats.biggest, d);
    target.lastHitBy = attacker; target.lastHitAt = F.clock;
  }
  F.stall = 0;
  sparks(x, y, d, attacker ? attacker.color : '#ffffff');
  floatText(target.body.position.x + rand(-10, 10), target.body.position.y - 50, '-' + Math.max(1, Math.round(d)),
            d > CONFIG.bigHit ? '#ffd23f' : '#ffffff', clamp(16 + d * 0.7, 16, 42));
  if (d > CONFIG.bigHit) F.shake = Math.min(16, 5 + d * 0.3);
  if (!target.rage && target.hp > 0 && target.hp / target.maxHp < CONFIG.rageBelow) {
    target.rage = true;
    setBanner('FINISH IT!', '#ff4d5e', 1.1, `${target.name} enters RAGE MODE (+${CONFIG.rageDamageBonus * 100}% dmg)`);
  }
  if (target.hp <= 0) endFight(F.robots.find(r => r !== target), 'KO');
}

function checkWin() {
  const F = fight, A = CONFIG.arena;
  for (const r of F.robots) {
    const other = F.robots.find(o => o !== r);
    if (r.body.position.y > A.floorY + A.pitKODepth) return endFight(other, 'Pit');
    if (r.flippedTime >= CONFIG.flipKOSeconds) return endFight(other, 'Flip');
  }
  if (F.time <= 0) {
    const [a, b] = F.robots, pa = a.hp / a.maxHp, pb = b.hp / b.maxHp;
    endFight(Math.abs(pa - pb) < 1e-6 ? null : pa > pb ? a : b, 'Time');
  }
}

function endFight(winner, method) {
  const F = fight;
  if (F.phase !== 'fight') return;
  F.phase = 'ko'; F.winner = winner; F.method = method;
  F.slow = method !== 'Time';
  F.koT = F.slow ? CONFIG.slowMo.seconds : 1.4;
  const label = { KO: 'K.O.!', Pit: 'RING OUT!', Flip: 'FLIPPED!', Time: 'TIME!' }[method];
  setBanner(label, method === 'Time' ? '#ffffff' : '#ff4d5e', F.koT + 0.3);
  if (F.slow) F.shake = 14;
}

// ============================================================
// EFFECTS: particles, floating text, banners, shake + all drawing
// ============================================================
const cv = document.getElementById('arena'), ctx = cv.getContext('2d');

function sparks(x, y, dmg, color) {
  if (!fight) return;
  const n = Math.min(40, 5 + Math.round(dmg * 1.2));
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(1.5, 4) + dmg * 0.15;
    fight.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5, life: rand(0.25, 0.6), max: 0.6,
                           color: Math.random() < 0.5 ? color : '#fff2a8', size: 1.5 + dmg * 0.06 });
  }
}
function floatText(x, y, text, color, size) { if (fight) fight.texts.push({ x, y, text, color, size, life: 1 }); }
function setBanner(text, color, dur, sub) { if (fight) fight.banner = { text, color, dur, t: dur, sub: sub || '' }; }

function updateEffects(gdt, dt) {
  const F = fight; if (!F) return;
  const k = gdt * 60;
  F.particles = F.particles.filter(p => {
    p.x += p.vx * k; p.y += p.vy * k; p.vy += 0.18 * k; p.vx *= 0.98; p.life -= gdt; return p.life > 0;
  });
  F.texts = F.texts.filter(t => { t.y -= 0.8 * k; t.life -= gdt * 1.1; return t.life > 0; });
  F.shake *= Math.pow(0.85, dt * 60);
  if (F.banner) { F.banner.t -= dt; if (F.banner.t <= 0) F.banner = null; }
}

function render() {
  const F = fight, A = CONFIG.arena;
  ctx.save();
  if (F.shake > 0.3) ctx.translate(rand(-F.shake, F.shake), rand(-F.shake, F.shake));
  drawArena();
  F.robots.forEach(drawRobot);
  ctx.globalCompositeOperation = 'lighter';
  F.particles.forEach(p => {
    ctx.strokeStyle = p.color; ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.lineWidth = p.size;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2, p.y - p.vy * 2); ctx.stroke();
  });
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  F.texts.forEach(t => {
    ctx.globalAlpha = clamp(t.life * 1.5, 0, 1);
    outlinedText(t.text, t.x, t.y, `900 ${t.size}px "Segoe UI", sans-serif`, t.color, 4);
  });
  ctx.globalAlpha = 1;
  ctx.restore();
  drawHUD();
}

function outlinedText(text, x, y, font, color, lw) {
  ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = lw; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}

function drawArena() {
  const F = fight, A = CONFIG.arena;
  let g = ctx.createLinearGradient(0, 0, 0, A.h);
  g.addColorStop(0, '#0e1226'); g.addColorStop(1, '#05060a');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, A.w + 40, A.h + 40);
  // spotlights
  [[300, '#3aa0ff'], [900, '#ff4d5e'], [600, '#ffffff']].forEach(([x, c]) => {
    const s = ctx.createRadialGradient(x, 0, 10, x, 0, 520);
    s.addColorStop(0, c + '22'); s.addColorStop(1, c + '00');
    ctx.fillStyle = s; ctx.fillRect(0, 0, A.w, A.h);
  });
  // crowd + camera flashes (WWE vibe)
  F.crowd.forEach(c => {
    ctx.fillStyle = `rgba(120,135,180,${c.s})`;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(c.x - c.r, c.y + c.r * 0.6, c.r * 2, 30);
  });
  if (Math.random() < 0.08) {
    const c = pick(F.crowd);
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(c.x, c.y - 4, 3, 0, Math.PI * 2); ctx.fill();
  }
  // LED board
  ctx.fillStyle = '#0a0d18'; ctx.fillRect(0, 432, A.w, 40);
  ctx.fillStyle = 'rgba(255,210,63,.25)'; ctx.font = 'italic 900 20px "Segoe UI", sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const off = (F.clock * 60) % 300;
  for (let x = -off; x < A.w; x += 300) ctx.fillText('ROBO OLYMPICS ★', x, 452);
  // pits
  [[A.wallW, F.floorL], [F.floorR, A.w - A.wallW]].forEach(([x0, x1]) => {
    const pg = ctx.createLinearGradient(0, A.floorY, 0, A.h);
    pg.addColorStop(0, '#05060a'); pg.addColorStop(1, '#ff2a2a55');
    ctx.fillStyle = pg; ctx.fillRect(x0, A.floorY - 10, x1 - x0, A.h);
    ctx.fillStyle = 'rgba(255,80,80,.5)'; ctx.font = '900 14px "Segoe UI", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('PIT', (x0 + x1) / 2, A.h - 30);
  });
  // floor
  g = ctx.createLinearGradient(0, A.floorY, 0, A.h);
  g.addColorStop(0, '#2c3350'); g.addColorStop(1, '#141826');
  ctx.fillStyle = g; ctx.fillRect(F.floorL, A.floorY, F.floorR - F.floorL, A.h - A.floorY);
  ctx.fillStyle = '#7f8fc4'; ctx.fillRect(F.floorL, A.floorY, F.floorR - F.floorL, 2);
  [F.floorL, F.floorR - 24].forEach(x => {
    for (let i = 0; i < 4; i++) { ctx.fillStyle = i % 2 ? '#111' : '#ffd23f'; ctx.fillRect(x + i * 6, A.floorY + 2, 6, 10); }
  });
  // walls
  ctx.fillStyle = '#1a1e30';
  ctx.fillRect(0, 0, A.wallW, A.h); ctx.fillRect(A.w - A.wallW, 0, A.wallW, A.h);
  ctx.fillStyle = '#262c45';
  for (let y = 0; y < A.h; y += 40) { ctx.fillRect(4, y, A.wallW - 8, 3); ctx.fillRect(A.w - A.wallW + 4, y, A.wallW - 8, 3); }
}

function drawRobot(r) {
  const c = rectCentre(r);
  if (r.rage) {   // DBZ-style aura
    const pulse = 50 + Math.sin(fight.clock * 18) * 8;
    const ag = ctx.createRadialGradient(c.x, c.y, 10, c.x, c.y, pulse + r.g.w / 2);
    ag.addColorStop(0, 'rgba(255,200,60,.35)'); ag.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(c.x, c.y, pulse + r.g.w / 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(r.body.angle);
  drawChassisLocal(ctx, r.build, r.g, r.color, { hammer: hammerAngle(r.hammerT), flip: flipAngle(r.flipT), boost: r.boostT > 0 });
  ctx.restore();
  r.wheels.forEach(w => drawWheel(ctx, w.position.x, w.position.y, r.g.r, w.angle));
  if (r.spinner) drawSpinner(ctx, r.spinner.position.x, r.spinner.position.y, r.g.spinner.r, r.spinner.angle, r.spin / CONFIG.weapons.spinner.spinMax);
  if (r.flippedTime > 0.3 && fight.phase === 'fight') {
    outlinedText(`FLIPPED ${Math.max(0, CONFIG.flipKOSeconds - r.flippedTime).toFixed(1)}`, c.x, c.y - 60, '900 16px "Segoe UI", sans-serif', '#ff8a1f', 4);
  }
}

// Shared by builder preview and fight: draws chassis, wedge, armour, hammer in chassis-local space
function drawChassisLocal(c, b, g, color, anim) {
  const { w, h, f } = g;
  if (anim.boost) {
    c.fillStyle = Math.random() < 0.5 ? '#ffb02e' : '#ff5a1f';
    c.beginPath(); c.moveTo(-f * w / 2, -6); c.lineTo(-f * (w / 2 + rand(18, 30)), 0); c.lineTo(-f * w / 2, 6); c.fill();
  }
  if (g.wedge && b.weapon === 'ram') {
    c.fillStyle = '#9aa3b5'; c.strokeStyle = '#d7deea'; c.lineWidth = 1.5;
    c.beginPath(); g.wedge.forEach((v, i) => i ? c.lineTo(v.x, v.y) : c.moveTo(v.x, v.y)); c.closePath(); c.fill(); c.stroke();
  }
  if (g.wedge && b.weapon === 'flipper') {
    const hinge = g.wedge[1];
    c.save(); c.translate(hinge.x, hinge.y); c.rotate(-f * anim.flip * 0.9);
    c.fillStyle = '#ffd23f'; c.strokeStyle = '#fff3b0'; c.lineWidth = 1.5;
    c.beginPath(); g.wedge.forEach((v, i) => i ? c.lineTo(v.x - hinge.x, v.y - hinge.y) : c.moveTo(v.x - hinge.x, v.y - hinge.y)); c.closePath(); c.fill(); c.stroke();
    c.restore();
  }
  // body
  const bg = c.createLinearGradient(0, -h / 2, 0, h / 2);
  bg.addColorStop(0, color); bg.addColorStop(1, shade(color, -0.45));
  c.fillStyle = bg; c.strokeStyle = shade(color, 0.4); c.lineWidth = 2;
  roundRect(c, -w / 2, -h / 2, w, h, 5); c.fill(); c.stroke();
  c.fillStyle = 'rgba(0,0,0,.25)'; roundRect(c, -w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 3); c.fill();
  // visor (front)
  c.fillStyle = '#bff4ff'; c.shadowColor = '#7fe7ff'; c.shadowBlur = 8;
  c.fillRect(f > 0 ? w / 2 - 16 : -w / 2 + 6, -h / 2 + 4, 10, 5);
  c.shadowBlur = 0;
  // armour plates on top
  for (let i = 0; i < b.armour; i++) {
    c.fillStyle = i ? '#8e98ad' : '#b8c2d8'; c.strokeStyle = '#59627a'; c.lineWidth = 1;
    roundRect(c, -w / 2 + 6, -h / 2 - 5 - i * 5, w - 22, 5, 1.5); c.fill(); c.stroke();
  }
  // hammer arm
  if (g.hammer) {
    const hm = g.hammer, th = anim.hammer;
    const hx = hm.x + f * hm.len * Math.cos(th), hy = hm.y + hm.len * Math.sin(th);
    c.strokeStyle = '#6c768f'; c.lineWidth = 6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(hm.x, hm.y); c.lineTo(hx, hy); c.stroke();
    c.save(); c.translate(hx, hy); c.rotate(Math.atan2(Math.sin(th), f * Math.cos(th)) + Math.PI / 2);
    c.fillStyle = '#3a4156'; c.strokeStyle = color; c.lineWidth = 2;
    roundRect(c, -13, -9, 26, 18, 3); c.fill(); c.stroke();
    c.restore();
    c.fillStyle = '#c8cfdd'; c.beginPath(); c.arc(hm.x, hm.y, 5, 0, Math.PI * 2); c.fill();
  }
}

function drawWheel(c, x, y, r, a) {
  c.save(); c.translate(x, y); c.rotate(a);
  c.fillStyle = '#16181f'; c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
  c.strokeStyle = '#4a5068'; c.lineWidth = 2; c.stroke();
  c.strokeStyle = '#8a93a8'; c.lineWidth = 2;
  for (let i = 0; i < 3; i++) { const t = i * Math.PI * 2 / 3; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(t) * r * 0.75, Math.sin(t) * r * 0.75); c.stroke(); }
  c.fillStyle = '#c8cfdd'; c.beginPath(); c.arc(0, 0, r * 0.22, 0, Math.PI * 2); c.fill();
  c.restore();
}

function drawSpinner(c, x, y, r, a, spinFrac) {
  c.save(); c.translate(x, y);
  if (spinFrac > 0.3) {
    c.strokeStyle = `rgba(255,255,255,${0.15 + spinFrac * 0.25})`; c.lineWidth = 4;
    c.beginPath(); c.arc(0, 0, r + 4, 0, Math.PI * 2); c.stroke();
  }
  c.rotate(a);
  c.fillStyle = '#c3cad8'; c.strokeStyle = '#5c6479'; c.lineWidth = 2;
  c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = '#e9edf5';
  for (let i = 0; i < 3; i++) {
    c.rotate(Math.PI * 2 / 3);
    c.beginPath(); c.moveTo(r - 3, -4); c.lineTo(r + 6, 0); c.lineTo(r - 3, 5); c.fill();
  }
  c.fillStyle = '#2a2f3f'; c.beginPath(); c.arc(0, 0, r * 0.3, 0, Math.PI * 2); c.fill();
  c.restore();
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const ch = s => clamp(Math.round(amt < 0 ? s * (1 + amt) : s + (255 - s) * amt), 0, 255);
  return `rgb(${ch(n >> 16)},${ch((n >> 8) & 255)},${ch(n & 255)})`;
}

function drawHUD() {
  const F = fight, A = CONFIG.arena;
  F.robots.forEach((r, i) => {
    const W = 440, H = 22, x = i ? A.w - 30 - W : 30, y = 26;
    const pct = r.hp / r.maxHp, ghost = r.ghost / r.maxHp;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - 3, y - 3, W + 6, H + 6);
    ctx.fillStyle = '#2a0d12'; ctx.fillRect(x, y, W, H);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(i ? x + W - W * ghost : x, y, W * ghost, H);
    const hg = ctx.createLinearGradient(0, y, 0, y + H);
    hg.addColorStop(0, pct < CONFIG.rageBelow ? '#ff6b3d' : r.color); hg.addColorStop(1, shade(pct < CONFIG.rageBelow ? '#ff6b3d' : r.color, -0.4));
    ctx.fillStyle = hg; ctx.fillRect(i ? x + W - W * pct : x, y, W * pct, H);
    ctx.font = 'italic 900 18px "Segoe UI", sans-serif'; ctx.textBaseline = 'top'; ctx.textAlign = i ? 'right' : 'left';
    ctx.fillStyle = '#fff'; ctx.fillText(r.name.toUpperCase(), i ? x + W : x, y + H + 6);
    ctx.font = '600 11px "Segoe UI", sans-serif'; ctx.fillStyle = '#9aa6c4';
    const info = `${CONFIG.weapons[r.build.weapon].name.toUpperCase()} · ${Math.ceil(r.hp)}/${r.maxHp} HP${r.mode ? ' · ' + r.mode : ''}${r.rage ? ' · RAGE' : ''}`;
    ctx.fillText(info, i ? x + W : x, y + H + 28);
  });
  // timer
  ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.beginPath(); ctx.arc(A.w / 2, 40, 32, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = F.time < 10 ? '#ff4d5e' : '#ffd23f'; ctx.lineWidth = 3; ctx.stroke();
  outlinedText(String(Math.ceil(F.time)), A.w / 2, 41, '900 30px "Segoe UI", sans-serif', F.time < 10 ? '#ff4d5e' : '#fff', 3);
  // banner
  if (F.banner) {
    const b = F.banner, age = b.dur - b.t, s = 1 + Math.max(0, 0.4 - age) * 1.5;
    ctx.save(); ctx.globalAlpha = clamp(b.t * 3, 0, 1); ctx.translate(A.w / 2, A.h / 2 - 60); ctx.scale(s, s);
    const size = b.text.length > 14 ? 44 : 78;
    outlinedText(b.text, 0, 0, `italic 900 ${size}px "Segoe UI", sans-serif`, b.color, 8);
    if (b.sub) outlinedText(b.sub, 0, size * 0.75, '700 18px "Segoe UI", sans-serif', '#cfd6ea', 4);
    ctx.restore();
  }
}

// ============================================================
// RESULT SCREEN
// ============================================================
function showResult() {
  const F = fight;
  F.phase = 'result';
  const methods = { KO: 'Knockout · HP reached 0', Pit: 'Ring out · fell into the pit', Flip: 'Flipped · stuck upside down for 5 s', Time: 'Time up · higher HP % wins' };
  const w = document.getElementById('resWinner');
  w.textContent = F.winner ? `${F.winner.name} wins!` : 'Draw!';
  w.style.color = F.winner ? F.winner.color : '#ffffff';
  document.getElementById('resMethod').textContent = methods[F.method];
  document.getElementById('resStats').innerHTML =
    '<tr><th>Robot</th><th>Damage dealt</th><th>Biggest hit</th><th>Hits</th><th>HP left</th></tr>' +
    F.robots.map(r => `<tr><td style="color:${r.color};font-weight:700">${r.name}</td><td>${Math.round(r.stats.dealt)}</td>` +
      `<td>${Math.round(r.stats.biggest)}</td><td>${r.stats.hits}</td><td>${Math.round(r.hp / r.maxHp * 100)}%</td></tr>`).join('');
  document.getElementById('result').style.display = 'flex';
  if (AUTO) autoNext();
}

// ============================================================
// BOOT (+ #auto headless test mode: random matches, results logged to the page)
// ============================================================
document.getElementById('fightBtn').addEventListener('click', startFight);
document.getElementById('rematchBtn').addEventListener('click', startFight);
document.getElementById('backBtn').addEventListener('click', backToBuilder);
document.getElementById('abortBtn').addEventListener('click', backToBuilder);
document.getElementById('randomMatchBtn').addEventListener('click', () => {
  players.forEach((p, i) => {
    p.build = PARTS.randomBuild(); p.name = PARTS.randomName(); p.strategy = pick(STRATEGY_PRESETS).text; p.ready = true;
    document.querySelector('#panel' + i + ' .name').value = p.name;
    document.querySelector('#panel' + i + ' .strategy').value = p.strategy;
    refreshPanel(i);
  });
  startFight();
});
buildPanel(0); buildPanel(1); refreshPanel(0); refreshPanel(1);

let autoCount = 0;
function autolog(s) { document.getElementById('autolog').textContent += s + '\n'; }
function autoNext() {
  const F = fight;
  autolog(`#${++autoCount} ${F.robots.map(r => `${r.build.chassis}/${r.build.wheels}/${r.build.weapon}/a${r.build.armour} ${Math.round(r.hp)}hp`).join(' vs ')}` +
          ` -> ${F.winner ? 'P' + (F.winner.player.id + 1) + ' ' + F.winner.build.weapon : 'draw'} by ${F.method} at ${Math.round(CONFIG.fightSeconds - F.time)}s` +
          (F.method === 'Pit' ? ` (loser mode ${F.robots.find(r => r !== F.winner).mode}, hit ${(F.clock - F.robots.find(r => r !== F.winner).lastHitAt).toFixed(1)}s ago)` : ''));
  if (autoCount >= (parseInt(location.hash.slice(5)) || 8)) { document.title = 'AUTODONE'; return; }
  setTimeout(() => document.getElementById('randomMatchBtn').click(), 300);
}
if (AUTO) {
  window.addEventListener('error', e => autolog('ERROR ' + e.message + ' @' + e.lineno));
  document.getElementById('randomMatchBtn').click();
}
