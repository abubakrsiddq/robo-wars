<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Robo Olympics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
:root{--p1:#3aa0ff;--p2:#ff4d5e;--text:#e8ecf5;--muted:#8a93a8;--gold:#ffd23f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1a1f33,#07080d 70%);color:var(--text);font-family:"Segoe UI",system-ui,Arial,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer}
header{text-align:center;padding:6px 0 0}
header h1{margin:0;font-size:30px;letter-spacing:4px;font-weight:900;font-style:italic;text-transform:uppercase;background:linear-gradient(90deg,var(--p1),#fff,var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:0;color:var(--muted);font-size:13px}
.small-btn{background:#232a40;color:var(--text);border:1px solid #333c5c;border-radius:8px;padding:8px 10px;white-space:nowrap}
.small-btn:hover{border-color:var(--gold)}

/* ---- BUILDER ---- */
#builderScreen{display:grid;grid-template-columns:minmax(0,1.5fr) 250px minmax(0,1fr);gap:16px;padding:6px 20px 12px;max-width:1360px;margin:0 auto;align-items:start}
.panel{--c:var(--p1);background:linear-gradient(180deg,#171c2c,#10131e);border:1px solid #232a40;border-top:4px solid var(--c);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.panel.p2{--c:var(--p2)}
.panel h2{margin:0 0 8px;color:var(--c);font-size:14px;letter-spacing:3px;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center}
input.name{flex:1;min-width:0;background:#0b0e17;border:1px solid #2a3150;color:var(--text);font-size:18px;font-weight:700;padding:7px 10px;border-radius:8px}
canvas.preview{width:100%;height:auto;background:radial-gradient(ellipse at 50% 80%,#1d2440,#0b0e17);border-radius:10px;margin:8px 0 2px;display:block}
.group{margin:6px 0 0}
.lbl{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.pick{background:#0d111c;border:2px solid #262e48;color:var(--text);border-radius:10px;padding:5px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:.12s}
.pick .ic{font-size:18px;line-height:1}
.pick b{font-size:14px}
.pick small{font-size:11px;color:var(--muted);line-height:1.2;min-height:26px}
.pick:hover{border-color:#4a5578;transform:translateY(-1px)}
.pick.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,#0d111c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 40%,transparent)}
.stat{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat span{width:42px}
.stat i{flex:1;height:5px;background:#1b2135;border-radius:3px;overflow:hidden}
.stat i u{display:block;height:100%;background:var(--c);border-radius:3px}
.foe{--c:var(--p2);display:grid;grid-template-columns:96px 1fr;gap:4px 10px;align-items:center;margin-bottom:8px;width:100%}
.foe canvas{width:96px;height:56px;background:radial-gradient(ellipse at 50% 80%,#1d2440,#0b0e17);border-radius:6px}
.foe .tx{display:flex;flex-direction:column;gap:2px}
.foe b{font-size:15px}
.foe small{font-size:11px;color:var(--muted);line-height:1.3;min-height:0}
.tier{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:1px 8px;border-radius:10px;color:#10131e;width:max-content}
.center{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:80px;text-align:center}
.vs{font-size:56px;font-weight:900;font-style:italic;color:var(--gold);text-shadow:0 0 24px rgba(255,210,63,.5)}
#fightBtn{padding:18px 26px;font-size:26px;font-weight:900;letter-spacing:2px;border:none;border-radius:12px;background:linear-gradient(180deg,#ffd23f,#ff8a1f);color:#1a1000;text-transform:uppercase;box-shadow:0 6px 0 #a34d00}
#fightBtn:hover{filter:brightness(1.1)}
#fightBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #a34d00}
.keys{font-size:12px;color:var(--muted);background:#0f1320;border:1px solid #232a40;border-radius:10px;padding:8px 12px;line-height:1.9;text-align:left}
.keys h3{margin:0 0 2px;font-size:11px;letter-spacing:2px;color:var(--text);text-transform:uppercase}
kbd{display:inline-block;min-width:22px;text-align:center;background:#232a40;border:1px solid #3a4468;border-bottom-width:3px;border-radius:5px;padding:0 5px;color:var(--text);font:700 11px monospace;margin-right:2px}
#randomMatchBtn{display:none}
.rightcol{display:flex;flex-direction:column;gap:12px;min-width:0}
#arenaPick{--c:var(--gold);background:linear-gradient(180deg,#171c2c,#10131e);border:1px solid #232a40;border-radius:14px;padding:10px 14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.arenas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.arena-opt{padding:6px}
.arena-opt canvas{width:100%;height:auto;aspect-ratio:2/1;border-radius:6px;display:block;margin-bottom:3px;background:#05060a}
.arena-opt small{min-height:0}

/* ---- FIGHT / RESULT ---- */
#fightScreen{display:none;padding:12px}
#arena{display:block;width:100%;max-width:1200px;margin:0 auto;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#05060a}
.fight-bar{max-width:1200px;margin:8px auto;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}

#result{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(5,6,10,.55),rgba(5,6,10,.9));backdrop-filter:blur(4px);z-index:50}
#result .card{--wc:#ffd23f;position:relative;overflow:hidden;background:linear-gradient(180deg,#171c2e,#0e111c);border:2px solid var(--wc);border-radius:18px;padding:26px 38px 24px;text-align:center;min-width:500px;max-width:92vw;box-shadow:0 0 50px color-mix(in srgb,var(--wc) 40%,transparent),0 30px 80px rgba(0,0,0,.7);animation:cardPop .45s cubic-bezier(.2,1.4,.4,1) both}
#result .card::before{content:"";position:absolute;left:-20%;right:-20%;top:-40%;height:80%;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--wc) 30%,transparent),transparent 70%);pointer-events:none}
#result .card>*{position:relative}
@keyframes cardPop{from{transform:scale(.7) translateY(30px);opacity:0}to{transform:none;opacity:1}}
#resBadge{font-size:12px;font-weight:800;letter-spacing:6px;text-transform:uppercase;opacity:.9}
#resWinner{font-size:46px;font-weight:900;font-style:italic;text-transform:uppercase;margin:2px 0 0;line-height:1.1}
#resMethod{color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-weight:700;font-size:13px;margin:8px 0 18px}
#resStats{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:22px}
#resStats th,#resStats td{padding:7px 10px;border-bottom:1px solid #232a40}
#resStats th{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:1px}
#resStats td.lbl2{color:var(--muted);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:1px}
#resStats td.best{color:#fff;font-weight:800;text-shadow:0 0 10px var(--wc)}
#resStats td:not(.lbl2){color:#aab3cc}
.btns{display:flex;gap:12px;justify-content:center}
.btns button{padding:13px 24px;border-radius:10px;border:none;font-weight:800;letter-spacing:1px;text-transform:uppercase;transition:transform .12s,filter .12s}
.btns button:hover{transform:translateY(-2px);filter:brightness(1.12)}
#rematchBtn{background:linear-gradient(180deg,#ffd23f,#ff8a1f);color:#1a1000;box-shadow:0 5px 0 #a34d00}
#backBtn{background:#232a40;color:var(--text);box-shadow:0 5px 0 #121626}
#autolog{position:fixed;bottom:0;left:0;font-size:11px;color:#6f7;margin:0;padding:4px;max-height:40vh;overflow:auto;pointer-events:none}
</style>
</head>
<body>

<header>
  <h1>Robo Olympics</h1>
  <p>Pick your robot. Pick your rival. Fight!</p>
</header>

<div id="builderScreen">
  <div class="panel p1" id="panel0"></div>
  <div class="center">
    <div class="vs">VS</div>
    <button id="fightBtn">Fight!</button>
    <div class="keys">
      <h3>Controls</h3>
      <kbd>&larr;</kbd><kbd>&rarr;</kbd> move &nbsp;<kbd>&uarr;</kbd> hop &nbsp;<kbd>&darr;</kbd> brake<br>
      <kbd>W</kbd> Attack &nbsp;<kbd>A</kbd> Dodge<br>
      <kbd>S</kbd> Block &nbsp;<kbd>D</kbd> Dash
    </div>
    <button id="randomMatchBtn">Random</button>
  </div>
  <div class="rightcol">
    <div class="panel p2" id="panel1"></div>
    <div id="arenaPick"></div>
  </div>
</div>

<div id="fightScreen">
  <canvas id="arena" width="1200" height="600"></canvas>
  <div class="fight-bar">
    <span><b id="arenaName"></b> · Win by KO · Flip (5 s stuck) · Pit · or HP% at time-out</span>
    <button class="small-btn" id="abortBtn">✕ Back to Builder</button>
  </div>
</div>

<div id="result">
  <div class="card" id="resCard">
    <div id="resBadge">Winner</div>
    <p id="resWinner">Winner</p>
    <div id="resMethod">KO</div>
    <table id="resStats"></table>
    <div class="btns">
      <button id="rematchBtn">Rematch</button>
      <button id="backBtn">Back to Builder</button>
    </div>
  </div>
</div>

<pre id="autolog"></pre>

<script src="src/config.js"></script>
<script src="src/parts.js"></script>
<script src="src/ai.js"></script>
<script src="src/character.js"></script>
<script src="src/arena.js"></script>
<script src="src/controls.js"></script>
<script src="src/combat.js"></script>
<script src="src/fx.js"></script>
<script src="src/hud.js"></script>
<script src="src/builder.js"></script>
<script src="src/main.js"></script>
</body>
</html>
